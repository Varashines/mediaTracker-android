name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`, but Google removed the legacy
          # `tools` package from the SDK repo — sdkmanager then exits 1 and the whole job
          # aborts before Gradle ever runs. Request only platform-tools; AGP auto-installs
          # the compileSdk platform (this action accepts the SDK licenses).
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Room schema is committed
        run: |
          # exportSchema writes app/schemas on every build. If that produces a new or
          # changed file, the schema change was not reviewed and committed alongside
          # the code, which means a release could ship without a matching Migration.
          ./gradlew :app:kspDebugKotlin
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema files changed but were not committed. Run ./gradlew :app:kspDebugKotlin and commit app/schemas."
            git --no-pager diff app/schemas
            exit 1
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # The instrumented *sources* are compiled here but not run: compiling takes seconds and
      # catches the rot that a suite which never executes accumulates. Running them needs an
      # emulator, which lives in android-instrumented.yml so a boot can never block a push.
      - name: Compile instrumented tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin